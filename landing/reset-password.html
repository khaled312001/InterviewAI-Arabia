<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>إعادة تعيين كلمة المرور — Interprova</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F9FD; --surface:#fff; --text:#0F172A; --text-2:#475569;
    --border:#DEE7F2; --primary:#1A56E8; --danger:#DC2626; --ok:#15803D;
    --r-lg:22px; --r-md:16px;
    --shadow:0 14px 40px rgba(15,23,42,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#080D1A;--surface:#111C31;--text:#F7F9FC;--text-2:#CBD5E1;
          --border:rgba(148,163,184,.18);--primary:#5B93FD;--shadow:0 14px 40px rgba(0,0,0,.4)}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);
        border-radius:var(--r-lg);box-shadow:var(--shadow);padding:32px}
  .brand{font-size:22px;font-weight:800;color:var(--primary);letter-spacing:-.4px;margin-bottom:22px}
  h1{font-size:23px;font-weight:800;margin:0 0 8px;letter-spacing:-.4px}
  p.sub{color:var(--text-2);font-size:14.5px;line-height:1.8;margin:0 0 22px}
  label{display:block;font-size:13.5px;font-weight:600;margin:0 0 7px}
  input{width:100%;padding:13px 15px;font:inherit;font-size:15px;color:var(--text);
        background:transparent;border:1.5px solid var(--border);border-radius:var(--r-md);
        outline:none;transition:border-color .18s}
  input:focus{border-color:var(--primary)}
  .field{margin-bottom:18px}
  button{width:100%;padding:14px;font:inherit;font-size:15.5px;font-weight:700;color:#fff;
         background:var(--primary);border:0;border-radius:var(--r-md);cursor:pointer;
         transition:opacity .18s,transform .12s}
  button:hover:not(:disabled){opacity:.92}
  button:active:not(:disabled){transform:scale(.985)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .msg{margin:18px 0 0;padding:13px 15px;border-radius:var(--r-md);font-size:14px;line-height:1.7;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(220,38,38,.10);color:var(--danger);border:1px solid rgba(220,38,38,.28)}
  .msg.ok{background:rgba(21,128,61,.10);color:var(--ok);border:1px solid rgba(21,128,61,.28)}
  .hint{font-size:12.5px;color:var(--text-2);margin-top:8px;line-height:1.7}
  .back{display:block;text-align:center;margin-top:20px;font-size:14px;font-weight:600;
        color:var(--primary);text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Interprova</div>
  <h1>اختر كلمة مرور جديدة</h1>
  <p class="sub">أدخل كلمة مرور جديدة لحسابك. سيُبطَل الرابط بعد استخدامه مرة واحدة.</p>

  <form id="form" novalidate>
    <div class="field">
      <label for="pw">كلمة المرور الجديدة</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required dir="ltr">
      <div class="hint">٨ أحرف على الأقل.</div>
    </div>
    <div class="field">
      <label for="pw2">تأكيد كلمة المرور</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required dir="ltr">
    </div>
    <button id="submit" type="submit">حفظ كلمة المرور</button>
  </form>

  <div id="msg" class="msg"></div>
  <a class="back" href="/app/">العودة إلى التطبيق</a>
</main>

<script>
(function () {
  var token = new URLSearchParams(location.search).get('token') || '';
  var form = document.getElementById('form');
  var msg  = document.getElementById('msg');
  var btn  = document.getElementById('submit');

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'msg show ' + kind;
  }

  // No token means the link was mangled in transit — a mail client that wrapped
  // it, or a copy-paste that dropped the query string. Say so before the person
  // types a password into a form that cannot submit.
  if (!token) {
    form.style.display = 'none';
    say('الرابط غير مكتمل. افتحه مباشرةً من رسالة البريد، أو اطلب رابطًا جديدًا من التطبيق.', 'err');
    return;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw  = document.getElementById('pw').value;
    var pw2 = document.getElementById('pw2').value;

    if (pw.length < 8)  return say('كلمة المرور يجب ألا تقل عن ٨ أحرف.', 'err');
    if (pw !== pw2)     return say('كلمتا المرور غير متطابقتين.', 'err');

    btn.disabled = true;
    btn.textContent = 'جارٍ الحفظ…';

    fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: pw })
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.body && res.body.error ? res.body.error : 'failed');
        form.style.display = 'none';
        say('تم تغيير كلمة المرور. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.', 'ok');
      })
      .catch(function (err) {
        say(err.message || 'تعذّر إتمام العملية. اطلب رابطًا جديدًا وحاول مجددًا.', 'err');
        btn.disabled = false;
        btn.textContent = 'حفظ كلمة المرور';
      });
  });
})();
</script>
</body>
</html>
