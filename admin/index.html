<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ثقتي — لوحة التحكم</title>
    <link
      rel="preload"
      href="/admin/fonts/cairo-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Paints the stored colour scheme before React mounts, so a dark-mode
      // reload never flashes the light palette.
      (function () {
        try {
          var m = localStorage.getItem('mui-mode') || 'system';
          var d = m === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
          document.documentElement.setAttribute('data-mui-color-scheme', d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
